<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Vendor Management</h1>
      <p class="text-sm text-gray-500 mt-1">Manage suppliers, billing details, and contact information.</p>
    </div>

    <button
      type="button"
      class="bg-brand-600 hover:bg-brand-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm"
      (click)="openCreateDrawer()">
      + Add Vendor
    </button>
  </div>

  <app-data-table
    [columns]="vendorColumns"
    [data]="vendors()"
    [isLoading]="isLoading()"
    [showSearch]="true"
    [showPagination]="true"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [totalElements]="totalElements"
    [pageSize]="pageSize"
    (searchChanged)="onSearchChange($event)"
    (pageChanged)="handlePageChange($event)"
    (actionClicked)="handleTableAction($event)">
  </app-data-table>

  <app-side-drawer
    [isOpen]="isDrawerOpen"
    [title]="isViewMode ? 'View Vendor Details' : (isEditMode ? 'Edit Vendor' : 'Invite Vendor')"
    (closed)="isDrawerOpen = false">

    <form class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Vendor Name @if (!isViewMode) { <span class="text-red-500">*</span> }
        </label>
        <input
          type="text"
          name="vendorName"
          [(ngModel)]="vendorName"
          [disabled]="isViewMode"
          placeholder="e.g. Atlas Supplies"
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Contact Person @if (!isViewMode) { <span class="text-red-500">*</span> }
        </label>
        <input
          type="text"
          name="contactPerson"
          [(ngModel)]="contactPerson"
          [disabled]="isViewMode"
          placeholder="e.g. Arjun Nair"
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email Address @if (!isViewMode) { <span class="text-red-500">*</span> }
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          [disabled]="isViewMode || isEditMode"
          placeholder="vendor@company.com"
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
        @if (isEditMode && !isViewMode) {
          <p class="text-xs text-amber-600 mt-1">Email addresses cannot be changed after vendor creation.</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Contact Phone @if (!isViewMode) { <span class="text-red-500">*</span> }
        </label>
        <input
          type="tel"
          name="contactPhone"
          [(ngModel)]="contactPhone"
          [disabled]="isViewMode"
          placeholder="+91 98765 43210"
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            GSTIN
          </label>
          <input
            type="text"
            name="gstin"
            [(ngModel)]="gstin"
            [disabled]="isViewMode"
            placeholder="29ABCDE1234F1Z5"
            class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            PAN
          </label>
          <input
            type="text"
            name="pan"
            [(ngModel)]="pan"
            [disabled]="isViewMode"
            placeholder="ABCDE1234F"
            class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Billing Address @if (!isViewMode) { <span class="text-red-500">*</span> }
        </label>
        <textarea
          name="billingAddress"
          [(ngModel)]="billingAddress"
          [disabled]="isViewMode"
          rows="3"
          placeholder="123 Business Park, Bengaluru, Karnataka"
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500"></textarea>
      </div>

      @if (isEditMode || isViewMode) {
        <div class="flex items-center gap-2 pt-2">
          <input
            type="checkbox"
            id="vendorStatusToggle"
            name="isActive"
            [(ngModel)]="isActive"
            [disabled]="isViewMode"
            class="w-4 h-4 text-brand-600 border-gray-300 rounded focus:ring-brand-600 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
          <label for="vendorStatusToggle" class="text-sm font-medium text-gray-700" [class.cursor-pointer]="!isViewMode">
            Vendor is Active
          </label>
        </div>
      }
    </form>

    <div drawer-footer class="flex w-full justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
        (click)="isDrawerOpen = false">
        {{ isViewMode ? 'Close' : 'Cancel' }}
      </button>

      @if (!isViewMode) {
        <button
          type="button"
          class="bg-brand-600 hover:bg-brand-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[150px]"
          (click)="saveVendor()"
          [disabled]="!vendorName || !contactPerson || !email || !contactPhone || !billingAddress || isSubmitting">
          @if (isSubmitting) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Saving...
          } @else {
            {{ isEditMode ? 'Save Changes' : 'Create Vendor' }}
          }
        </button>
      }
    </div>
  </app-side-drawer>
</div>
