<div class="space-y-6">
  
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">User Management</h1>
      <p class="text-sm text-gray-500 mt-1">Manage workspace members and their access levels.</p>
    </div>

    <!-- Assuming you have an app-button based on your dashboard code -->
    <button class="bg-brand-600 hover:bg-brand-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm" 
            (click)="openCreateDrawer()">
      + Add User
    </button>
  </div>

  <!-- Reusable Data Table -->
  <app-data-table 
    [columns]="userColumns" 
    [data]="users()" 
    [selectable]="false"
    (actionClicked)="handleTableAction($event)">
  </app-data-table>

  <!-- Reusable Side Drawer for the Form -->
  <app-side-drawer 
    [isOpen]="isDrawerOpen" 
    [title]="isViewMode ? 'View User Details' : (isEditMode ? 'Edit User' : 'Invite User')"
    (closed)="isDrawerOpen = false">
    
    <form class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Full Name @if(!isViewMode){ <span class="text-red-500">*</span> }
        </label>
        <input type="text" placeholder="e.g. John Doe" name="userName" [(ngModel)]="userName" 
          [disabled]="isViewMode"
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email Address @if(!isViewMode){ <span class="text-red-500">*</span> }
        </label>
        <input type="email" placeholder="colleague@company.com" name="emailId" [(ngModel)]="emailId" 
          [disabled]="isViewMode || isEditMode"
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-brand-600 outline-none transition-all disabled:bg-gray-100 disabled:text-gray-500">
          @if (isEditMode && !isViewMode) {
            <p class="text-xs text-amber-600 mt-1">Email addresses cannot be changed after invitation.</p>
          }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          {{ (isViewMode || isEditMode) ? 'Assigned Roles' : 'Assign Roles' }} 
          @if(!isViewMode){ <span class="text-red-500">*</span> }
        </label>
        <div class="space-y-2 max-h-[400px] overflow-y-auto pr-1">
          @for (role of availableRoles(); track role.id) {
            
            <label class="flex items-start p-3 border rounded-lg transition-all duration-200"
                   [ngClass]="isRoleSelected(role.id) ? 'bg-brand-50 border-brand-500' : 'bg-white border-gray-200 hover:bg-gray-50'"
                   [class.cursor-pointer]="!isViewMode"
                   [class.opacity-75]="isViewMode && !isRoleSelected(role.id)">
              
              <div class="flex-shrink-0 mt-0.5">
                <input type="checkbox" 
                       class="w-4 h-4 text-brand-600 border-gray-300 rounded focus:ring-brand-600 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
                       [checked]="isRoleSelected(role.id)"
                       (change)="toggleRole(role.id)" 
                       [disabled]="isViewMode">
              </div>
              
              <div class="ml-3 flex-1">
                <div class="flex justify-between items-center">
                  <span class="block text-sm font-bold text-gray-900" 
                        [class.text-brand-700]="isRoleSelected(role.id)">
                    {{ formatName(role.name) }}
                  </span>
                  <button type="button" (click)="toggleExpandRole($event, role.id)"
                    class="text-xs font-medium text-brand-600 hover:text-brand-800 hover:underline flex items-center transition-colors">
                    {{ isRoleExpanded(role.id) ? 'Hide' : 'View' }} {{ role.permissions.length || 0 }} permissions
                    <svg [class.rotate-180]="isRoleExpanded(role.id)" class="w-3.5 h-3.5 ml-1 transition-transform" fill="none"
                      stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                  </button>
                </div>
                
                @if (isRoleExpanded(role.id)) {
                  <div class="mt-3 pt-3 border-t border-gray-200/60 space-y-2.5">
                    @for (group of getGroupedPermissions(role.permissions); track group.module) {
                      <div>
                        <span class="block text-xs font-bold text-gray-700 mb-1.5">{{ group.module }}</span>
                        <div class="flex flex-wrap gap-1.5">
                          @for (priv of group.privileges; track priv) {
                            <span class="px-2 py-0.5 text-[10px] uppercase font-bold tracking-wide bg-white border border-gray-300 text-gray-600 rounded-md shadow-sm">
                              {{ priv }}
                            </span>
                          }
                        </div>
                      </div>
                    }
                  </div>
                }
              </div>
            </label>
            
          }
        </div>
      </div>

      @if (isEditMode || isViewMode) {
        <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" id="userStatusToggle" name="isActive" [(ngModel)]="isActive"
                   [disabled]="isViewMode"
                   class="w-4 h-4 text-brand-600 border-gray-300 rounded focus:ring-brand-600 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
            <label for="userStatusToggle" class="text-sm font-medium text-gray-700"
                   [class.cursor-pointer]="!isViewMode">
              User Account is Active
            </label>
        </div>
      }
    </form>
    
    <div drawer-footer class="flex w-full justify-end gap-3">
      <button
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
        (click)="isDrawerOpen = false">{{ isViewMode ? 'Close' : 'Cancel' }}</button>
      @if (!isViewMode) {
      <button
        class="bg-brand-600 hover:bg-brand-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[140px]"
        (click)="saveUser()" [disabled]="!emailId || selectedRoles.size === 0 || isSubmitting">
        @if (isSubmitting) {
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        Saving...
        } @else {
        {{ isEditMode ? 'Save Changes' : 'Create Role' }}
        }
      </button>
      }
    </div>
  </app-side-drawer>

</div>
