@if (toastService.currentToast(); as toast) {
  <div class="fixed bottom-4 right-4 z-50 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in"
    [ngClass]="toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'">
    
    @if (toast.type === 'success') {
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0"></path>
      </svg>
    } @else {
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0"></path>
      </svg>
    }
    
    <span class="text-sm font-medium">{{ toast.message }}</span>
  </div>
}
